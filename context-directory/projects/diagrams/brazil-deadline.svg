<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="486" viewBox="0 0 1160 486">
<rect width="1160" height="486" fill="#FFFFFF"/>
<text x="28" y="40" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1F2933">Two filings fall due on 30 October — nine days</text>
<text x="28" y="62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#6B7280">Unrelated rules, same date. Both are filings, not projects: they get missed by forgetting, not by failing.</text>
<line x1="70" y1="112" x2="1090" y2="112" stroke="#D0D5DD" stroke-width="3"/>
<circle cx="70" cy="112" r="7" fill="#1F2933"/>
<text x="70" y="94" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">21 Oct</text>
<text x="70" y="138" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#6B7280" text-anchor="middle">today</text>
<line x1="1020" y1="78" x2="1020" y2="134" stroke="#B42318" stroke-width="3"/>
<circle cx="1020" cy="112" r="9" fill="#B42318"/>
<text x="1020" y="68" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#B42318" text-anchor="middle">30 Oct</text>
<circle cx="176" cy="112" r="3.5" fill="#D0D5DD"/>
<circle cx="281" cy="112" r="3.5" fill="#D0D5DD"/>
<circle cx="387" cy="112" r="3.5" fill="#D0D5DD"/>
<circle cx="492" cy="112" r="3.5" fill="#D0D5DD"/>
<circle cx="598" cy="112" r="3.5" fill="#D0D5DD"/>
<circle cx="703" cy="112" r="3.5" fill="#D0D5DD"/>
<circle cx="809" cy="112" r="3.5" fill="#D0D5DD"/>
<circle cx="914" cy="112" r="3.5" fill="#D0D5DD"/>
<rect x="28" y="176" width="548" height="222" rx="9" fill="#FEF0C7" stroke="#B54708" stroke-width="1.5"/><text x="50" y="204" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#B54708" letter-spacing="0.8">FILING 1</text><text x="50" y="230" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#1F2933">PSAV authorisation — stage 1</text><text x="50" y="256" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2933">Corporate documents, audited financial statements</text><text x="50" y="276" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2933">and a formal communication to the BCB.</text><text x="50" y="296" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2933">Applies only if we are inside the PSAV perimeter.</text><text x="50" y="316" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2933">Pinheiro Neto engaged 5 Oct for the FX licence —</text><text x="50" y="336" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2933">the perimeter opinion has not come back.</text><rect x="50" y="356" width="504" height="26" rx="5" fill="#FFFFFF" stroke="#B42318" stroke-width="1.3"/><text x="60" y="374" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#B42318">BLOCKED — no legal opinion yet</text>
<rect x="584" y="176" width="548" height="222" rx="9" fill="#FEF0C7" stroke="#B54708" stroke-width="1.5"/><text x="606" y="204" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#B54708" letter-spacing="0.8">FILING 2</text><text x="606" y="230" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#1F2933">Unicad — declare the eFX service</text><text x="606" y="256" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2933">Institutions already authorised that provide eFX</text><text x="606" y="276" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2933">must declare it in their Unicad registration.</text><text x="606" y="296" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2933">Unclear whether this sits inside the Pinheiro Neto</text><text x="606" y="316" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2933">engagement or with our own legal team.</text><text x="606" y="336" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1F2933"></text><rect x="606" y="356" width="504" height="26" rx="5" fill="#FFFFFF" stroke="#B42318" stroke-width="1.3"/><text x="616" y="374" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#B42318">UNCONFIRMED — owner not established</text>
<text x="28" y="432" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1F2933">One question unblocks both:</text>
<text x="276" y="432" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1F2933">is Unlimit Brasil inside the PSAV perimeter, and which IP modality is it authorised in?</text>
<text x="28" y="456" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B7280">Pinheiro Neto is already retained. The questions are drafted. They have not been sent.</text>
</svg>