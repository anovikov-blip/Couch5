<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600">
<rect width="1160" height="600" fill="#fcfcfb"/>
<text x="28" y="40" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0b0b0b">1. eFX теперь только для регулируемых компаний</text>
<text x="28" y="62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#52514e">eFX — приём платежей для иностранных мерчантов и выплаты им. Не путать с FX.</text>
<rect x="28" y="84" width="1104" height="138" rx="10" fill="#FEE4E2" stroke="#FDA29B" stroke-width="1.3"/><rect x="28" y="84" width="6" height="138" rx="3" fill="#B42318"/><text x="50" y="109" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#B42318" letter-spacing="0.9">БЫЛО — до 1 октября</text><text x="50" y="129" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14.5" fill="#0b0b0b">eFX могли делать и регулируемые, и нерегулируемые компании</text>
<rect x="60" y="148" width="170" height="58" rx="7" fill="#FFFFFF" stroke="#0b0b0b" stroke-width="1.7"/><text x="145.0" y="183.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">PIX</text>
<line x1="234" y1="177.0" x2="279" y2="177.0" stroke="#0b0b0b" stroke-width="2.0"/><polygon points="288,177.0 278,171.5 278,182.5" fill="#0b0b0b"/>
<rect x="292" y="148" width="250" height="58" rx="7" fill="#FFFFFF" stroke="#B42318" stroke-width="1.7"/><text x="417.0" y="176.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">UN PSP Brasil</text><text x="417.0" y="195.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle">нерегулируемая — несла часть флоу</text>
<line x1="546" y1="177.0" x2="591" y2="177.0" stroke="#0b0b0b" stroke-width="2.0"/><polygon points="600,177.0 590,171.5 590,182.5" fill="#0b0b0b"/>
<rect x="604" y="148" width="210" height="58" rx="7" fill="#FFFFFF" stroke="#0b0b0b" stroke-width="1.7"/><text x="709.0" y="183.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Конверсия и вывод</text>
<text x="840" y="174" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#B42318">Схема закрыта</text>
<text x="840" y="193" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#52514e">регулированием с 1 октября</text>
<rect x="28" y="238" width="1104" height="152" rx="10" fill="#D1FADF" stroke="#6CE9A6" stroke-width="1.3"/><rect x="28" y="238" width="6" height="152" rx="3" fill="#027A48"/><text x="50" y="263" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#027A48" letter-spacing="0.9">СТАЛО</text><text x="50" y="283" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14.5" fill="#0b0b0b">Деньги не лежат в Dock ни секунды</text>
<rect x="60" y="308" width="170" height="58" rx="7" fill="#FFFFFF" stroke="#0b0b0b" stroke-width="1.7"/><text x="145.0" y="336.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">PIX</text><text x="145.0" y="355.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle">через Dock или напрямую</text>
<line x1="234" y1="337.0" x2="279" y2="337.0" stroke="#027A48" stroke-width="2.0"/><polygon points="288,337.0 278,331.5 278,342.5" fill="#027A48"/>
<rect x="292" y="308" width="210" height="58" rx="7" fill="#FFFFFF" stroke="#027A48" stroke-width="1.7"/><text x="397.0" y="336.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">UN Brazil IP</text><text x="397.0" y="355.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle">регулируемая</text>
<line x1="506" y1="337.0" x2="563" y2="337.0" stroke="#027A48" stroke-width="2.0"/><polygon points="572,337.0 562,331.5 562,342.5" fill="#027A48"/><text x="539.0" y="328.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#027A48" text-anchor="middle">сразу</text>
<rect x="576" y="308" width="262" height="58" rx="7" fill="#FFFFFF" stroke="#027A48" stroke-width="1.7"/><text x="707.0" y="336.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Спецсчёт в FX-банке</text><text x="707.0" y="355.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle">открываем в Genial и в BTG</text>
<line x1="842" y1="337.0" x2="887" y2="337.0" stroke="#027A48" stroke-width="2.0"/><polygon points="896,337.0 886,331.5 886,342.5" fill="#027A48"/>
<rect x="900" y="308" width="200" height="58" rx="7" fill="#FFFFFF" stroke="#0b0b0b" stroke-width="1.7"/><text x="1000.0" y="343.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Конверсия → за рубеж</text>
<rect x="28" y="406" width="1104" height="166" rx="10" fill="#FEF0C7" stroke="#FEC84B" stroke-width="1.3"/><rect x="28" y="406" width="6" height="166" rx="3" fill="#B54708"/><text x="50" y="431" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#B54708" letter-spacing="0.9">ЧТО ВЫПАЛО — нужно решение</text><text x="50" y="451" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14.5" fill="#0b0b0b">Два последствия, второе пока ничьё</text>
<rect x="60" y="470" width="510" height="88" rx="7" fill="#FFFFFF" stroke="#B54708" stroke-width="1.7"/><text x="315.0" y="506.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">UN PSP Brasil выпадает из основного флоу</text><text x="315.0" y="524.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">Договоры, где она фигурирует, надо переподписать</text><text x="315.0" y="537.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">в том числе CSA-02 CrossBorder IP–PSP Brasil / PSP Uruguai, подписан 30 сентября</text>
<rect x="590" y="470" width="510" height="88" rx="7" fill="#FFFFFF" stroke="#B54708" stroke-width="1.7"/><text x="845.0" y="506.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Карточный эквайринг для иностранных мерчантов</text><text x="845.0" y="524.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">UN Brazil IP не может онбордить их сама —</text><text x="845.0" y="537.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">нужен байпас. Владельца у задачи пока нет</text>
</svg>