<rect x="28" y="228" width="6" height="124" rx="3" fill="#027A48"/>
<text x="50" y="254" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#027A48">СХЕМА B — без IOF вообще</text>
<text x="430" y="254" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#52514e">запрет на расчёт в крипте связывает eFX-провайдеров, держателей NRA — нет</text>
