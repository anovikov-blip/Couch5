<line x1="776" y1="305.0" x2="819" y2="305.0" stroke="#027A48" stroke-width="2"/><polygon points="828,305.0 818,299.5 818,310.5" fill="#027A48"/>
<rect x="832" y="276" width="278" height="58" rx="7" fill="#FFFFFF" stroke="#027A48" stroke-width="1.7"/><text x="971.0" y="311.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="middle">IOF = 0</text>
<text x="28" y="372" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0b0b0b">Стоимость вывода денег из Бразилии</text>
<text x="28" y="394" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#52514e">Доля от объёма. На каждых R$ 100 млн разница между крайними вариантами — R$ 3,4 млн.</text>
<text x="224" y="447" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="end">Традиционно</text>
<rect x="240" y="426" width="518.0" height="30" rx="4" fill="#2a78d6"/>
<text x="772.0" y="447" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">3,7%</text>
<text x="832.0" y="447" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#52514e">0,2% спред + 3,5% IOF</text>
<text x="224" y="493" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="end">INTEX</text>
<rect x="240" y="472" width="280.0" height="30" rx="4" fill="#2a78d6"/>
<text x="534.0" y="493" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">2,0%</text>
<text x="594.0" y="493" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#52514e">их компания в США с MTL-лицензией, NRA в Intex Bank</text>
<text x="224" y="539" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="end">CALIZA</text>
<rect x="240" y="518" width="42.0" height="30" rx="4" fill="#2a78d6"/>
<text x="296.0" y="539" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b">0,3%</text>
<text x="356.0" y="539" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#52514e">обычные коммерческие банки</text>
<line x1="240" y1="420" x2="240" y2="554" stroke="#E3E1DA" stroke-width="1.5"/>
<rect x="28" y="574" width="1104" height="56" rx="8" fill="#FEF0C7" stroke="#FEC84B" stroke-width="1.3"/>
<text x="50" y="597" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#B54708">До того как пойдёт объём — письменное заключение по IOF от Pinheiro Neto.</text>
<text x="50" y="616" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#52514e">Они на ретейнере с 5 октября и ещё ничего не спрошено. Бразильская компания под надзором BACEN.</text>
