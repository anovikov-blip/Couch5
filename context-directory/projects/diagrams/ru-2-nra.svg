<text x="50" y="112" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#2a78d6">СХЕМА A — схлопывание встречных потоков</text>
<rect x="50" y="134" width="152" height="58" rx="7" fill="#FFFFFF" stroke="#0b0b0b" stroke-width="1.7"/><text x="126.0" y="161.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">UN Brazil IP</text><text x="126.0" y="179.75" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">собирает PIX</text>
