<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660">
<rect width="1160" height="660" fill="#fcfcfb"/>
<text x="28" y="40" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0b0b0b">2. NRA — две схемы и во что обходится вывод</text>
<text x="28" y="62" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#52514e">Первый NRA в Бразилии для мексиканской компании Ebury открывает на этой неделе.</text>
