<rect x="862" y="134" width="248" height="58" rx="7" fill="#FFFFFF" stroke="#2a78d6" stroke-width="1.7"/><text x="986.0" y="168.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">IOF только на разницу</text>
